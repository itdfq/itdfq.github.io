# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: GodChin
subtitle: GodChin
description: JAVA
keywords: "123"
author: duan
language: zh-CN
timezone: Asia/Shanghai

# URL
## 站点真实访问域名（此前误填为 GitHub 仓库地址，会导致 sitemap/feed 里 URL 错误）
url: https://bestduan.cn
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# 中文标题转拼音，保持历史 URL 不变（线上已有 URL 依赖此项，勿关）
permalink_pinyin:
  enable: true
  separator: '-'

# 本地搜索（Butterfly 使用）
search:
  path: search.xml
  field: post
  content: true
  format: html

# RSS 订阅
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date

# 站点地图
sitemap:
  path: sitemap.xml

# 百度站点地图
baidusitemap:
  path: baidusitemap.xml

# 首页设置
index_generator:
  path: ''
  per_page: 12
  order_by: -date

# 分类与标签
default_category: uncategorized
category_map:
tag_map:

# 日期时间格式
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# 分页
per_page: 12
pagination_dir: page

# 扩展
## 插件: https://hexo.io/plugins/
## 主题: https://hexo.io/themes/
theme: butterfly

# 部署
## 注意：线上实际由 GitHub Actions 自动部署，此段仅供本地 `hexo deploy` 手动使用
deploy:
- type: git
  repository:
    github: https://github.com/itdfq/itdfq.github.io
  branch: master